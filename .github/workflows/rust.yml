name: Rust

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: ruby scripts/test_update_homebrew.rb
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo package --locked
      - name: Package tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "$RELEASE_TAG" = "v$version"
          archive="cockup-$RELEASE_TAG-$RELEASE_TARGET"
          mkdir -p "dist/$archive"
          cp "target/$RELEASE_TARGET/release/cockup" LICENSE README.md README_zh-cn.md "dist/$archive/"
          cp -R docs "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          cd dist
          shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: cockup-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish-check:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry-run crates.io publish
        run: cargo publish --locked --dry-run

  publish:
    needs: publish-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cockup-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  update-tap:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    concurrency:
      group: cockup-homebrew-tap
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "Add HOMEBREW_TAP_TOKEN with Contents read/write access to huaium/homebrew-tap" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          path: cockup
          persist-credentials: false
      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: huaium/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            archive="cockup-$RELEASE_TAG-$target.tar.gz"
            gh release download "$RELEASE_TAG" --repo huaium/cockup \
              --pattern "$archive" --pattern "$archive.sha256" --dir assets
          done
      - name: Update formula and verify checksums
        run: ruby cockup/scripts/update_homebrew.rb "$RELEASE_TAG" tap/Formula/cockup.rb assets
      - name: Test updated formula
        run: |
          ruby -c tap/Formula/cockup.rb
          tap_path="$(brew --repository)/Library/Taps/huaium/homebrew-tap"
          mkdir -p "$(dirname "$tap_path")"
          ln -s "$GITHUB_WORKSPACE/tap" "$tap_path"
          brew install huaium/tap/cockup
          brew test huaium/tap/cockup
          test "$(cockup --version)" = "cockup ${RELEASE_TAG#v}"
      - name: Push formula update
        working-directory: tap
        run: |
          if git diff --quiet -- Formula/cockup.rb; then
            echo "Formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cockup.rb
          git commit -m "cockup: update to ${RELEASE_TAG#v}"
          git push origin HEAD:main
