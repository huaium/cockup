include:
  - "./another_config.yaml"

destination: "dst"

clean: true

metadata: true

rules:
  - from: "src"
    targets:
      - "log_folder"
      - "*log.txt"
    to: "log"
    on-start:
      - name: "Show Rule 1 welcome message"
        command: ["echo", "This is the first rule!"]
        output: true
        timeout: 3
    on-end:
      - name: "Show Rule 1 goodbye message"
        command: ["echo", "Bye Rule 1!"]
        output: true
        timeout: 5

hooks:
  pre-backup:
    - name: "Show welcome message"
      command: ["echo", "Welcome to cockup!"]
      output: true
      timeout: 3
    - name: "Show environment variables"
      command: ["env"]
      output: true
      timeout: 3
      env:
        USER: "cockup_user"
        CUSTOM_VAR: "custom_value"

    - name: "Check created file"
      command:
        - python
        - -c
        - "from pathlib import Path; Path('.hook-check-result.txt').write_text('ready')"
      check:
        - python
        - -c
        - "from pathlib import Path; p = Path('.hook-check-result.txt'); result = p.read_text(); p.unlink(); assert result == 'ready'; print('Check passed')"
      output: true
      timeout: 5

    - name: "Check failure"
      command: ["python", "-c", "print('Main command succeeded')"]
      check:
        [
          "python",
          "-c",
          "import sys; print('Check failed intentionally'); sys.exit(1)",
        ]
      output: true
      timeout: 5

  post-backup:
    - name: "Show goodbye message"
      command: ["echo", "See you next time!"]
      output: true
      timeout: 5
