symlinks: reference
destination: dst/hooks
rules: []
hooks:
  pre-backup:
    - name: Check created file
      command: 'printf ready > .hook-check-result.txt'
      cwd: .
      check: 'value=$(cat .hook-check-result.txt) && rm .hook-check-result.txt && test "$value" = ready && echo "Check passed"'
      output: true
      timeout: 5
    - name: Check failure
      command: "echo 'Main command succeeded'"
      check: "echo 'Check failed intentionally'; exit 1"
      output: true
      timeout: 5
    - name: Show environment
      command: 'printf "%s\n" "$SAMPLE_MESSAGE"'
      check: 'test "$SAMPLE_MESSAGE" = "Hello from a hook"'
      env:
        SAMPLE_MESSAGE: Hello from a hook
      output: true
      timeout: 5
