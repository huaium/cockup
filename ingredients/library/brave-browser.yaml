# Checked against: brew cat --cask brave-browser (zap section).
# Browser preferences and profiles, including local browsing data.
# Include-only; review contents before backing up or restoring.
rules:
  - from: "~/Library/Application Support"
    targets: ["BraveSoftware/Brave-Browser"]
    to: "Library/Application Support"
  - from: "~/Library/Preferences"
    targets: ["com.brave.Browser.plist"]
    to: "Library/Preferences"
