# Checked against: brew cat --cask vlc (zap section).
# VLC preferences and application configuration.
# Include-only; review contents before backing up or restoring.
rules:
  - from: "~/Library/Application Support"
    targets: ["org.videolan.vlc", "VLC"]
    to: "Library/Application Support"
  - from: "~/Library/Preferences"
    targets: ["org.videolan.vlc", "org.videolan.vlc.plist"]
    to: "Library/Preferences"
