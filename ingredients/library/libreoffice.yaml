# Checked against: brew cat --cask libreoffice (zap section).
# LibreOffice user configuration, templates, and preference plist.
# Include-only; review contents before backing up or restoring.
rules:
  - from: "~/Library/Application Support"
    targets: ["LibreOffice"]
    to: "Library/Application Support"
  - from: "~/Library/Preferences"
    targets: ["org.libreoffice.script.plist"]
    to: "Library/Preferences"
