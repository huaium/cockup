# Checked against: brew cat --cask skim.
# PDF viewer preferences and bookmarks; PDF documents excluded.
# Include-only; custom XDG_CONFIG_HOME or config overrides need local rules.
rules:
  - from: "~/Library/Preferences"
    targets: ["net.sourceforge.skim-app.skim.plist", "net.sourceforge.skim-app.skim.bookmarks.plist"]
    to: "Library/Preferences"
