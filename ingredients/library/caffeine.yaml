# Checked against: brew cat --cask caffeine.
# Keep-awake preferences and application support.
# Include-only; custom XDG_CONFIG_HOME or config overrides need local rules.
rules:
  - from: "~/Library/Application Support"
    targets: ["com.intelliscapesolutions.caffeine"]
    to: "Library/Application Support"
  - from: "~/Library/Preferences"
    targets: ["com.intelliscapesolutions.caffeine.plist"]
    to: "Library/Preferences"
