# Checked against: brew cat --cask obs (zap section).
# OBS profiles, scenes, and application support; may contain stream credentials and logs.
# Include-only; review contents before backing up or restoring.
rules:
  - from: "~/Library/Application Support"
    targets: ["obs-studio"]
    to: "Library/Application Support"
  - from: "~/Library/Preferences"
    targets: ["com.obsproject.obs-studio.plist"]
    to: "Library/Preferences"
