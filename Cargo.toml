[package]
name = "cockup"
version = "0.2.0"
edition = "2024"
description = "Yet another backup tool for various configurations"
license = "MIT"
readme = "README.md"
repository = "https://github.com/huaium/cockup"
homepage = "https://github.com/huaium/cockup"
authors = ["huaium <adamzhangme@gmail.com>"]
keywords = ["backup", "restore", "configuration", "macos", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "/src/**",
    "/tests/cli.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/justfile",
    "/README*.md",
    "/sample/*.yaml",
    "/sample/*.md",
    "/docs/**",
]

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[[bin]]
name = "cockup"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0.151"
glob = "0.3.4"
filetime = "0.2.29"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }

[dev-dependencies]
tempfile = "3.27.0"
